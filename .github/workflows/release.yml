name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify immutable version identity
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Pack once
        id: pack
        run: |
          package_json="$RUNNER_TEMP/npm-pack.json"
          npm pack --json > "$package_json"
          filename="$(jq -er 'if length == 1 then .[0].filename else error("expected one packed tarball") end' "$package_json")"
          sha="$(sha256sum "$filename" | awk '{print $1}')"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish the tested bytes with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if url="$(npm view "@sourcey/catalog-verifier@$version" dist.tarball 2>/dev/null)"; then
            curl --fail-with-body --silent --show-error --max-time 120 \
              --output "$RUNNER_TEMP/existing.tgz" "$url"
            test "$(sha256sum "$RUNNER_TEMP/existing.tgz" | awk '{print $1}')" = "$EXPECTED_SHA256"
          else
            npm publish "${{ steps.pack.outputs.filename }}" --access public --provenance
          fi
      - name: Read back the immutable registry release
        env:
          EXPECTED_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          version="$(node -p "require('./package.json').version")"
          url=""
          for attempt in $(seq 1 12); do
            if url="$(npm view "@sourcey/catalog-verifier@$version" dist.tarball 2>/dev/null)"; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/readback.tgz" "$url"
          test "$(sha256sum "$RUNNER_TEMP/readback.tgz" | awk '{print $1}')" = "$EXPECTED_SHA256"
